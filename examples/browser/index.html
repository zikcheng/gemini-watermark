<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gemini-watermark — browser example</title>
    <style>
      body {
        font: 15px/1.6 system-ui, sans-serif;
        margin: 0 auto;
        max-width: 46rem;
        padding: 2rem 1rem;
      }
      pre {
        background: #f4f4f5;
        border-radius: 6px;
        overflow-x: auto;
        padding: 0.75rem;
      }
      img {
        background: repeating-conic-gradient(#e4e4e7 0% 25%, #fff 0% 50%) 0 0 / 16px 16px;
        max-width: 100%;
      }
      a[hidden] {
        display: none;
      }
    </style>

    <!--
      The whole point of the example: the library is loaded as a plain ES
      module from a static file, with no bundler and no runtime dependency
      to resolve. The import map lets `main.js` say `from 'gemini-watermark'`
      -- the specifier a consumer writes -- while pointing it at the built
      bundle two directories up.

      Run `npm run build` at the repository root first; see README.md here.
    -->
    <script type="importmap">
      {
        "imports": {
          "gemini-watermark": "../../dist/index.js"
        }
      }
    </script>
  </head>
  <body>
    <h1>gemini-watermark</h1>
    <p>
      Pick a Gemini-generated image. Detection and removal both run in this tab — nothing is
      uploaded anywhere, and an image with no watermark comes back untouched.
    </p>

    <p><input type="file" id="file" accept="image/*" /></p>

    <p id="status">waiting for a file</p>
    <pre id="detail"></pre>

    <p><a id="download" hidden>download the result</a></p>
    <img id="preview" alt="the processed image" />

    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
