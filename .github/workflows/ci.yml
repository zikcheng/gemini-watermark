name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Same gate contributors run locally: forbidden-import scan,
      # typecheck, tests, build. Golden tests are excluded by design --
      # they need the out-of-repo reference kit (see vitest.config.ts).
      - run: npm run check
