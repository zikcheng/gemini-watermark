name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Tests across the whole supported Node range, and only the tests. The rest
  # of `check` -- forbidden-import scan, typecheck, build, package linting --
  # reads the source or the built artefact, neither of which varies with the
  # runtime, so running it three times would buy nothing. The behaviour that
  # *can* differ between Node versions is what executes, so that is what fans
  # out here.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Golden and browser tests are excluded from the default run by design
      # -- one needs the out-of-repo reference kit, the other a downloaded
      # Chromium (see vitest.config.ts).
      - run: npm run test

  # The same gate contributors run locally, end to end: import scan,
  # typecheck, tests, build, examples typechecked against the freshly built
  # declarations, then publint + attw against the packed tarball.
  #
  # Node 20 because `engines` says >=20. Running the full gate on the oldest
  # supported runtime is the point: if some step needs something newer, that
  # is a packaging bug, and this is where it surfaces rather than at a user.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  # The browser claim, checked rather than argued. `check` proves the
  # *source* never reaches for an environment; this proves the *built*
  # bundle loads and computes identically in a real Chromium. Separate job
  # because it needs a ~100 MB browser download the unit tests have no use
  # for, and one Node version because the thing under test is the artefact,
  # which does not vary across them.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `npx` runs the playwright the lockfile pinned, so the CLI that
      # downloads the browser and the library that drives it are always the
      # same version. Chromium only: the package promises browsers as a
      # class, and the port has no engine-specific code that a second
      # engine would exercise.
      - run: npx playwright install chromium --with-deps
      # The smoke test loads dist/, so it has to exist. It throws rather
      # than skips when it does not, so a forgotten build fails this job
      # instead of passing an empty one.
      - run: npm run build
      - run: npm run test:browser
